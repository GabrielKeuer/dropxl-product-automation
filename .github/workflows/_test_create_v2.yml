name: Test create_products_v2 (manuel)

# Manuel trigger med valgfri limit. For at validere productSet på smaa batches
# foer vi cutover. --dry-run default; saet 'live=true' for at oprette i Shopify.

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Faktisk oprettelse i Shopify (default false = dry-run)"
        type: boolean
        default: false
      limit:
        description: "Max antal produkter at oprette (sikkerhed). Tom = ingen limit."
        type: string
        default: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests beautifulsoup4 openpyxl supabase
      - name: Run create_products_v2
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_PRODUCTS_PER_RUN: ${{ vars.MAX_PRODUCTS_PER_RUN || '999' }}
          MAX_VARIANTS_PER_RUN: ${{ vars.MAX_VARIANTS_PER_RUN || '999' }}
          PRODUCT_ORDER: ${{ vars.PRODUCT_ORDER || 'newest' }}
        run: |
          ARGS=""
          if [ "${{ inputs.live }}" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/create_products_v2.py $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-specs
          path: output/product_specs_v2.json
          retention-days: 30
