name: Sollux Månedlig Slet udgåede

# Sletter udgåede Sollux-produkter (hele produkter + udgåede varianter). Sidste dag
# i måneden, 30 min efter opret-jobbet. Adskilt fra opret (matcher dropxl-mønster).

on:
  schedule:
    - cron: '30 2 28-31 * *'   # 04:30 København; gate sikrer KUN sidste dag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          ENABLED="${{ vars.AUTOMATION_ENABLED || 'true' }}"
          if [ "$ENABLED" != "true" ]; then echo "run=false" >> $GITHUB_OUTPUT; echo "toggle off"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$(date -d tomorrow +%d)" = "01" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; echo "ikke sidste dag — skip"; fi

  delete:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests openpyxl supabase beautifulsoup4

      - name: Slet udgåede Sollux-produkter (hele + varianter)
        env:
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          FEED_DIR: ${{ github.workspace }}/output/feed
        run: python scripts/delete_sollux_discontinued.py --apply --fetch

      - name: Commit audit-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/sollux_delete_list.json 2>/dev/null || true
          git commit -m "Sollux slet udgåede $(date +%Y-%m-%d)" || echo "intet at committe"
          git push || true
