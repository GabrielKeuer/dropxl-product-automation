name: Debug scrape (vidaXL)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "vidaXL URL"
        required: true
        default: "https://www.vidaxl.dk/e/vidaxl-tv-borde-2-stk.-med-led-lys-305x30x102-cm-hvid/8721012256002.html"
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 pandas openpyxl
      - run: python scripts/_debug_scrape.py "${{ inputs.url }}"
