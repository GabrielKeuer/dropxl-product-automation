name: Daglig Produkt Sletning

# Cutover 2026-06-02: delete_products_v2.py kalder productDelete +
# productVariantsBulkDelete via direct Shopify GraphQL Admin API.
# Workflow-strukturen er uændret: analyze → approval (hvis >threshold)
# → deploy. Threshold-gaten og manual-approval-issue er BEVARET 100%.
#
# 2026-11-20: vedvarenhedsregel. En SKU slettes først når den har manglet
# i feedet PERSIST_DAYS dage i træk; streaks gemmes i
# output/missing_history.json, som analyze-jobbet committer hver dag.
# Baggrund: 13.-20. nov svingede "mangler i feed" mellem 2.214 og 2.600,
# men kun 1.218 manglede alle 8 dage — resten kom tilbage i feedet.
# Desuden FEED_SHRINK_ABORT, der afbryder hvis feedet skrumper
# katastrofalt (afkortet/defekt download).

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-toggle:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check automation toggle
        id: check
        run: |
          ENABLED="${{ vars.AUTOMATION_ENABLED || 'true' }}"
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          if [ "$ENABLED" != "true" ]; then
            echo "⚠️ Automation er slået fra (AUTOMATION_ENABLED=$ENABLED)"
          fi

  analyze:
    needs: check-toggle
    if: needs.check-toggle.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      delete_count: ${{ steps.run.outputs.delete_count }}
      missing_count: ${{ steps.run.outputs.missing_count }}
      waiting_count: ${{ steps.run.outputs.waiting_count }}
      returned_count: ${{ steps.run.outputs.returned_count }}
      persist_days: ${{ steps.run.outputs.persist_days }}
      needs_approval: ${{ steps.run.outputs.needs_approval }}
      feed_count: ${{ steps.run.outputs.feed_count }}
      shopify_count: ${{ steps.run.outputs.shopify_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Kør slette-analyse (writes delete_list.json)
        id: run
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          DELETE_THRESHOLD: ${{ vars.DELETE_THRESHOLD || '1000' }}
          PERSIST_DAYS: ${{ vars.PERSIST_DAYS || '3' }}
          FEED_SHRINK_ABORT: ${{ vars.FEED_SHRINK_ABORT || '0.25' }}
        run: python scripts/delete_products_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: delete-list
          path: output/delete_list.json
          retention-days: 30
      # Streak-historikken SKAL committes hver dag, også når sletningen
      # afventer godkendelse — ellers kan en SKU aldrig modne.
      - name: Commit streak-historik
        if: always()
        run: |
          if [ ! -f output/missing_history.json ]; then
            echo "Ingen historik skrevet (analysen afbrød) — intet at committe"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/missing_history.json
          git diff --staged --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "📆 Slette-historik: $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push forsøg $i fejlede, prøver igen"
            sleep 5
          done
          echo "⚠️ kunne ikke pushe historikken" && exit 1

  approval:
    needs: analyze
    if: needs.analyze.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Vent på godkendelse
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "⚠️ Sletning af ${{ needs.analyze.outputs.delete_count }} produkter kræver godkendelse"
          issue-body: |
            ## Threshold overskredet

            | Metric | Værdi |
            |--------|-------|
            | Feed | ${{ needs.analyze.outputs.feed_count }} |
            | Shopify | ${{ needs.analyze.outputs.shopify_count }} |
            | Mangler i feed i dag | ${{ needs.analyze.outputs.missing_count }} |
            | Kom tilbage i feedet | ${{ needs.analyze.outputs.returned_count }} |
            | Afventer flere dage | ${{ needs.analyze.outputs.waiting_count }} |
            | **Slettes** (manglet ${{ needs.analyze.outputs.persist_days }} dage i træk) | **${{ needs.analyze.outputs.delete_count }}** |

            De SKUs der slettes har manglet i vidaXL-feedet
            ${{ needs.analyze.outputs.persist_days }} dage i træk. Varer der er
            kommet tilbage i feedet er allerede sorteret ud.

            Kommenter `approved` eller `denied`.

  deploy:
    needs: [analyze, approval]
    if: |
      always() &&
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.delete_count != '0' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - uses: actions/download-artifact@v4
        with:
          name: delete-list
          path: output/
      - name: Apply deletes (direct API)
        env:
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python scripts/delete_products_v2.py --apply
      - name: Commit audit trail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/delete_list.json output/matrixify_delete.csv
          git diff --staged --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "🗑️ Sletning: ${{ needs.analyze.outputs.delete_count }} produkter ($(date +%Y-%m-%d))"
          git pull --rebase --autostash
          git push

  notify:
    needs: [check-toggle, analyze, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## 🗑️ Daglig Sletning (direct API)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-toggle.outputs.enabled }}" != "true" ]; then
            echo "⏸️ **Automation slået fra**" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Metric | Værdi |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Feed | ${{ needs.analyze.outputs.feed_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Shopify | ${{ needs.analyze.outputs.shopify_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Mangler i feed i dag | ${{ needs.analyze.outputs.missing_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Kom tilbage i feedet | ${{ needs.analyze.outputs.returned_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Afventer flere dage | ${{ needs.analyze.outputs.waiting_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Slettet via API** | **${{ needs.analyze.outputs.delete_count }}** |" >> $GITHUB_STEP_SUMMARY
          fi
